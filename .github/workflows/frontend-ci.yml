name: Frontend build

on:
  push:
    branches: [frontend]
    paths:
      - "src/**"
      - "index.html"
      - "package.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [frontend]
    paths:
      - "src/**"
      - "index.html"
      - "package.json"
      - "tsconfig.json"
      - "vite.config.ts"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frontend branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type-check and build
        run: npm run build
