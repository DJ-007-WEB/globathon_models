name: ML service CI

on:
  push:
    branches: [ML_models]
    paths:
      - "ML-models/**"
      - ".github/workflows/ml-ci.yml"
      - "PROJECT_REQUIREMENTS.md"
  pull_request:
    branches: [ML_models]
    paths:
      - "ML-models/**"
      - ".github/workflows/ml-ci.yml"
      - "PROJECT_REQUIREMENTS.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ML-models
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ML-models/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run ML and API test suite
        run: python -m pytest -q
