# Semantic vocabulary used by the deterministic schema mapper.
# Aliases are normalized (lower-cased, accents stripped, separators collapsed)
# before matching.  Add variants here rather than in plant-specific code.
#
# Unit aliases are only used when the unit token appears in the original header.
# A bare magnitude is never used to infer a unit.

vocab_version: "1.0.0"

normalization:
  lowercase: true
  strip_accents: true
  # Characters that separate a header into searchable tokens.
  token_separators: [" ", "_", "-", ".", "/", "\\", "(", ")", "[", "]", "{", "}", ":", ";", ",", "\t", "\n", "\r"]
  compact_replacements:
    "²": "2"
    "³": "3"
    "°": "deg"

