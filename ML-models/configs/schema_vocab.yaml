# Unit families.  Canonical units are the units retained internally.
units:
  power:
    canonical: kW
    aliases:
      W: [w, watt, watts]
      kW: [kw, kilowatt, kilowatts]
      MW: [mw, megawatt, megawatts]
  energy:
    canonical: kWh
    aliases:
      Wh: [wh, watthour, watt hour, watt hours]
      kWh: [kwh, kilowatt hour, kilowatt hours]
      MWh: [mwh, megawatt hour, megawatt hours]
  irradiance:
    canonical: W/m2
    aliases:
      W/m2: [w/m2, wm2, w m2, watt/m2, watt per square meter, watts per square meter]
      kW/m2: [kw/m2, kwm2, kw m2, kilowatt/m2, kilowatt per square meter]
  temperature:
    canonical: C
    aliases:
      C: [c, degc, deg c, celsius, degree celsius, degrees celsius]
      F: [f, degf, deg f, fahrenheit, degree fahrenheit, degrees fahrenheit]
  capacity:
    canonical: kW
    aliases:
      Wp: [wp, watt peak, watts peak]
      kWp: [kwp, kilowatt peak, kilowatts peak]
      MWp: [mwp, megawatt peak, megawatts peak]
      kW: [kw]
      MW: [mw]

