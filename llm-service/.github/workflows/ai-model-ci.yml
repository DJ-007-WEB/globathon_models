name: AI model API CI

on:
  push:
    branches: [AI-model]
    paths:
      - "api.py"
      - "llm_service.py"
      - "schemas.py"
      - "tests/**"
      - "requirements-api.txt"
      - ".github/workflows/ai-model-ci.yml"
  pull_request:
    branches: [AI-model]
    paths:
      - "api.py"
      - "llm_service.py"
      - "schemas.py"
      - "tests/**"
      - "requirements-api.txt"
      - ".github/workflows/ai-model-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight API test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi>=0.115,<0.120" "starlette>=0.40,<0.50" "httpx>=0.27,<1.0" "python-dotenv>=1.0,<2.0" pytest
      - name: Run API contract tests
        run: python -m pytest -q tests
